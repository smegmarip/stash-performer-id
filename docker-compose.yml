# Ports are driven by SERVICE_PORT / VIEWER_PORT (see .env / .env.example).
services:
  stash-performer-id:
    build:
      context: .
      args:
        PORT: ${SERVICE_PORT:-15000}
    container_name: stash-performer-id
    restart: unless-stopped
    ports:
      - "${SERVICE_PORT:-15000}:${SERVICE_PORT:-15000}"
    environment:
      - PORT=${SERVICE_PORT:-15000}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:${SERVICE_PORT:-15000}}
      # Reach the host's Stash from inside the container (Docker Desktop resolves
      # host.docker.internal; extra_hosts below makes it work on Linux too).
      - STASH_URL=${STASH_URL:-http://host.docker.internal:9999}
      - STASH_API_KEY=${STASH_API_KEY:-}
      - PARSE_BOT_API_KEY=${PARSE_BOT_API_KEY:-}
      # Babepedia is behind Cloudflare; FlareSolverr solves the challenge (cloudscraper is tried
      # first, FlareSolverr only on a block). This is a container URL — Docker resolves the name on
      # a shared network, no IP needed. If FlareSolverr already runs on the same network, just set
      # this to its URL; if not, start the bundled sidecar with `--profile flaresolverr` (below).
      - FLARESOLVERR_URL=${FLARESOLVERR_URL:-http://flaresolverr:8191/v1}
      - TOP_FOLDER=${TOP_FOLDER:-}
      - MEDIA_ROOT=/data
      - DB_PATH=${DB_PATH:-/cache/stash-performer-id.sqlite}
    depends_on:
      # Wait for the bundled sidecar only when its profile is active; skipped otherwise.
      flaresolverr:
        condition: service_started
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Writable cache/DB dir. Override CACHE_ROOT_HOST to a host path the container user
      # (UID 1000) can write; the default ./cache is auto-created by the daemon as root and
      # will fail. The container mount target must match DB_PATH's directory.
      - ${CACHE_ROOT_HOST:-./cache}:/cache
      # Read-only media mount for path harvest (Phase 1). Point at the Stash media root.
      - ${MEDIA_ROOT_HOST:-./data}:/data:ro

  # Optional bundled FlareSolverr — only starts with `--profile flaresolverr` (or
  # COMPOSE_PROFILES=flaresolverr). Skip it if a FlareSolverr already runs on this network; the
  # default FLARESOLVERR_URL (http://flaresolverr:8191/v1) resolves to whichever one is present.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: stash-performer-id-flaresolverr
    profiles: ["flaresolverr"]
    restart: unless-stopped
    environment:
      - LOG_LEVEL=${FLARESOLVERR_LOG_LEVEL:-info}
    ports:
      - "${FLARESOLVERR_PORT:-8191}:8191"

  viewer:
    build:
      context: ./viewer
      args:
        # The browser derives <host>:VITE_API_PORT at runtime; keep it in sync with the service.
        VITE_API_PORT: ${SERVICE_PORT:-15000}
        # Or hard-set a full base if the service lives at a fixed URL:
        # VITE_API_BASE: "http://host:${SERVICE_PORT:-15000}"
    container_name: stash-performer-id-viewer
    restart: unless-stopped
    ports:
      - "${VIEWER_PORT:-15001}:80"
    depends_on:
      - stash-performer-id
