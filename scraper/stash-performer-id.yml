name: Stash Performer ID
# Image/scene scraper for the stash-performer-id metadata provider.
#
# Associates images and scenes with performers discovered by the service's name DB. Stash pipes the
# fragment to the transport script on stdin; the `--kind` arg selects the service endpoint
# (/scrape/image or /scrape/scene), and the script prints a ScrapedImage/ScrapedScene back. This is
# Step 2's association vehicle (docs/IMAGE_TAGGER_FEASIBILITY.md).
#
# Install: copy this dir into Stash's `scrapers/` folder, then Settings -> Metadata Providers ->
# Scrapers -> Reload. The transport reads the service URL from STASH_PERFORMER_ID_URL
# (default http://localhost:15000).
imageByFragment:
  action: script
  script:
    - python3
    - stash-performer-id-scrape.py
    - --kind
    - image
sceneByFragment:
  action: script
  script:
    - python3
    - stash-performer-id-scrape.py
    - --kind
    - scene
